version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: friotrack-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: friotrack360
      MYSQL_USER: friotrack
      MYSQL_PASSWORD: friotrack123
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./friotrack360.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - friotrack-network

  backend:
    build:
      context: ./Friotrack
      dockerfile: Dockerfile
    container_name: friotrack-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/friotrack360?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
      SPRING_DATASOURCE_USERNAME: friotrack
      SPRING_DATASOURCE_PASSWORD: friotrack123
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_JACKSON_PROPERTY_NAMING_STRATEGY: SNAKE_CASE
      SERVER_PORT: 8080
      APP_JWT_SECRET: ${APP_JWT_SECRET:-b260a64be60f4f2f51303b3c2186ecaabfb2937be1f8bc94eb93e23a7c7e9672}
      APP_JWT_EXPIRACION: ${APP_JWT_EXPIRACION:-7200}
      APP_BOOTSTRAP_ENABLED: ${APP_BOOTSTRAP_ENABLED:-true}
      APP_BOOTSTRAP_USERNAME: ${APP_BOOTSTRAP_USERNAME:-admin}
      APP_BOOTSTRAP_PASSWORD: ${APP_BOOTSTRAP_PASSWORD:-admin123}
      APP_BOOTSTRAP_NOMBRE: ${APP_BOOTSTRAP_NOMBRE:-Administrador}
      APP_BOOTSTRAP_APELLIDO: ${APP_BOOTSTRAP_APELLIDO:-Sistema}
      APP_BOOTSTRAP_ROL: ${APP_BOOTSTRAP_ROL:-ADMIN}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - friotrack-network

  frontend:
    build:
      context: ./front-friotrack
      dockerfile: Dockerfile
    container_name: friotrack-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - friotrack-network

volumes:
  mysql_data:

networks:
  friotrack-network:
    driver: bridge