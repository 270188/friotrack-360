spring.application.name=Friotrack

# --- Servidor ---
# Las plataformas en la nube (Railway, Render...) indican el puerto con la variable PORT.
server.port=${PORT:8080}

# --- Datasource ---
spring.datasource.url=jdbc:mysql://localhost:3306/friotrack360?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# validate: el esquema de friotrack360.sql es la fuente de verdad.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- JSON ---
# El JSON usa snake_case igual que las columnas: {"temperatura_min": 2.00}
spring.jackson.property-naming-strategy=SNAKE_CASE

spring.datasource.hikari.maximum-pool-size=10

# --- CORS ---
# Origenes del frontend que pueden llamar a la API, separados por coma. Acepta patrones.
# Ejemplo al desplegar el frontend: APP_CORS_ORIGINS=http://localhost:3000,https://friotrack360.vercel.app
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# --- JWT ---
app.jwt.secret=${APP_JWT_SECRET:b260a64be60f4f2f51303b3c2186ecaabfb2937be1f8bc94eb93e23a7c7e9672}
app.jwt.expiration-segundos=${APP_JWT_EXPIRACION:7200}

# --- Bootstrap del primer usuario ---
# Si la tabla usuario esta vacia, crea el usuario inicial. Si no, no hace nada.
app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:true}
app.bootstrap.username=${APP_BOOTSTRAP_USERNAME:admin}
app.bootstrap.password=${APP_BOOTSTRAP_PASSWORD:admin123}
app.bootstrap.nombre=${APP_BOOTSTRAP_NOMBRE:Administrador}
app.bootstrap.apellido=${APP_BOOTSTRAP_APELLIDO:Sistema}
app.bootstrap.rol=${APP_BOOTSTRAP_ROL:ADMIN}


# --- Base de datos: tablas nuevas ---
# Crea las tablas de comprobantes en bases que ya existian (CREATE TABLE IF NOT EXISTS).
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/comprobantes.sql

# --- Facturacion electronica SUNAT ---
# Por defecto: entorno BETA de SUNAT (pruebas, sin valor tributario) con usuario RUC + MODDATOS
# y un certificado de prueba incluido en el proyecto. La guia de remision se genera y firma, pero
# SUNAT no tiene entorno de pruebas para guias, asi que no se envia.
app.sunat.entorno=${SUNAT_ENTORNO:BETA}
app.sunat.url=${SUNAT_URL:https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService}
app.sunat.ruc=${SUNAT_RUC:20000000001}
app.sunat.razon-social=${SUNAT_RAZON_SOCIAL:EMPRESA DE PRUEBA S.A.C.}
app.sunat.nombre-comercial=${SUNAT_NOMBRE_COMERCIAL:}
app.sunat.ubigeo=${SUNAT_UBIGEO:150101}
app.sunat.departamento=${SUNAT_DEPARTAMENTO:LIMA}
app.sunat.provincia=${SUNAT_PROVINCIA:LIMA}
app.sunat.distrito=${SUNAT_DISTRITO:LIMA}
app.sunat.direccion=${SUNAT_DIRECCION:-}
app.sunat.usuario-sol=${SUNAT_USUARIO_SOL:MODDATOS}
app.sunat.clave-sol=${SUNAT_CLAVE_SOL:moddatos}
app.sunat.certificado=${SUNAT_CERTIFICADO:classpath:sunat/certificado-prueba.p12}
app.sunat.certificado-clave=${SUNAT_CERTIFICADO_CLAVE:prueba}
app.sunat.serie-factura=${SUNAT_SERIE_FACTURA:F001}
app.sunat.serie-boleta=${SUNAT_SERIE_BOLETA:B001}
app.sunat.serie-guia=${SUNAT_SERIE_GUIA:T001}
app.sunat.prueba-al-iniciar=${SUNAT_PRUEBA_AL_INICIAR:false}
