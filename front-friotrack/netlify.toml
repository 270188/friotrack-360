# Netlify: en el repositorio completo, configurar "Base directory" = front-friotrack
[build]
  command = "npm run build"
  publish = "dist/front-friotrack/browser"

[build.environment]
  NODE_VERSION = "22"

# Aplicación de una sola página: las rutas de Angular se resuelven en index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/config.json"
  [headers.values]
    Cache-Control = "no-store"
